[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-peering"
version = "0.1.0"
description = "MCP server for Peering Manager and PeeringDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcp-peering contributors" }]
keywords = ["mcp", "peering", "peeringdb", "peering-manager", "bgp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27.0",
    "ruff>=0.5",
]

[project.scripts]
mcp-peering = "mcp_peering.__main__:main"

[project.urls]
Homepage = "https://github.com/tsw2k/mcp-peering"
Repository = "https://github.com/tsw2k/mcp-peering"
Issues = "https://github.com/tsw2k/mcp-peering/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_peering"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
