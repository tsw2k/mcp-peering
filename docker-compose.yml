services:
  mcp-peering:
    build: .
    image: mcp-peering:latest
    container_name: mcp-peering
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN to a long random string}
      PEERING_MANAGER_URL: ${PEERING_MANAGER_URL:?required}
      PEERING_MANAGER_TOKEN: ${PEERING_MANAGER_TOKEN:?required}
      PEERING_MANAGER_VERIFY_SSL: ${PEERING_MANAGER_VERIFY_SSL:-true}
      PM_READONLY: ${PM_READONLY:-false}
      PEERINGDB_URL: ${PEERINGDB_URL:-https://www.peeringdb.com/api}
      PEERINGDB_API_KEY: ${PEERINGDB_API_KEY:-}
      PEERINGDB_USERNAME: ${PEERINGDB_USERNAME:-}
      PEERINGDB_PASSWORD: ${PEERINGDB_PASSWORD:-}
      PEERINGDB_CACHE_TTL: ${PEERINGDB_CACHE_TTL:-300}
      PEERINGDB_CACHE_SIZE: ${PEERINGDB_CACHE_SIZE:-128}
      PEERINGDB_RATE_LIMIT: ${PEERINGDB_RATE_LIMIT:-2}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
